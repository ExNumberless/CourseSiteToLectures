[project]
name = "coursesitetolectures"
version = "0.1.0"
description = "Turn a folder of course materials (lecture notes, slides, example code) into lecture transcripts and narrated audio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Addison Grant" }]
requires-python = ">=3.11"
keywords = ["opencourseware", "course", "lecture", "transcript", "text-to-speech", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "python-pptx>=1.0.2",
    "slidestolectures>=0.1.0",
]

[project.optional-dependencies]
tts = ["slidestolectures[tts]>=0.1.0"]

[project.scripts]
course-site-to-lectures = "coursesitetolectures.cli:main"

[project.urls]
Homepage = "https://github.com/ExNumberless/CourseSiteToLectures"
Issues = "https://github.com/ExNumberless/CourseSiteToLectures/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

# Until slidestolectures is on PyPI. uv drops this table from the built package's metadata.
[tool.uv.sources]
slidestolectures = { git = "https://github.com/ExNumberless/SlidesToLectures" }

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
